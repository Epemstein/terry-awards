name: Update NBA Data
on:
  schedule:
    # Run at 10am ET (2pm UTC) daily — after all games from the night before are final
    - cron: '0 14 * * *'
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tor proxy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor
          sudo systemctl start tor
          sleep 2
          # Verify Tor is running
          curl --socks5-hostname 127.0.0.1:9050 -s https://check.torproject.org/api/ip | head -c 100

      - name: Install Python dependencies
        run: pip install pandas requests pysocks

      - name: Update current season data
        run: python update_data.py
        env:
          USE_TOR_PROXY: "1"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update NBA data $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: update
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # get the latest after update job pushed
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
